<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" width="240" height="210">
    <defs>
        <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <style>
            .mark {
                stroke: #5340E0;
                stroke-width: 22;
                stroke-linecap: round;
                stroke-linejoin: round;
                fill: none;
            }
        </style>
    </defs>

    <g filter="url(#logoGlow)">
        <!-- Top bar -->
        <line class="mark" x1="88" y1="37" x2="152" y2="37"/>

        <!-- Left chevron -->
        <polyline class="mark" points="58,64 21,110 58,160"/>

        <!-- T — horizontal bar -->
        <line class="mark" x1="78" y1="87" x2="162" y2="87"/>
        <!-- T — vertical stem -->
        <line class="mark" x1="120" y1="87" x2="120" y2="160"/>

        <!-- Right chevron -->
        <polyline class="mark" points="182,64 219,110 182,160"/>
    </g>
</svg>