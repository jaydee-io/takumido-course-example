<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
        </linearGradient>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
            .takumido-wordmark {
                font-family: 'JetBrains Mono', monospace;
                font-size: 48px;
                font-weight: 600;
                fill: url(#purpleGrad);
                letter-spacing: 1px;
            }
        </style>
    </defs>

    <!-- Icon (scaled down and positioned left) -->
    <g transform="translate(10, 15) scale(0.5)">
        <!-- Enso circle -->
        <circle cx="60" cy="60" r="55" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.3" stroke-dasharray="150 30"/>

        <!-- Angular badge -->
        <polygon points="30,15 90,15 105,30 105,90 90,105 30,105 15,90 15,30"
                 fill="none" stroke="#7C3AED" stroke-width="2.5"/>
        <polygon points="32,18 88,18 102,32 102,88 88,102 32,102 18,88 18,32"
                 fill="#7C3AED" opacity="0.05"/>

        <!-- Letter T -->
        <g fill="#7C3AED">
            <rect x="38" y="30" width="44" height="5" rx="2"/>
            <rect x="56" y="35" width="8" height="52" rx="2"/>
            <polygon points="35,30 40,28 42,30 37,32"/>
            <polygon points="85,30 80,28 78,30 83,32"/>
            <polygon points="56,85 54,90 52,88 54,83"/>
            <polygon points="64,85 66,90 68,88 66,83"/>
        </g>
    </g>

    <!-- Wordmark "TAKUMIDŌ" -->
    <text x="75" y="85" class="takumido-wordmark">TAKUMIDŌ</text>
</svg>