<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
    <defs>
        <style>
            .logo-stroke {
                stroke: #8B5CF6;
                stroke-width: 5;
                stroke-linecap: round;
                stroke-linejoin: round;
                fill: none;
            }
        </style>
    </defs>

    <!-- Top separator line -->
    <line class="logo-stroke" x1="10" y1="15" x2="90" y2="15"/>

    <!-- Left chevron -->
    <polyline class="logo-stroke" points="15,32 8,50 15,68"/>

    <!-- T shape -->
    <!-- Horizontal bar -->
    <line class="logo-stroke" x1="28" y1="32" x2="72" y2="32"/>
    <!-- Vertical stem -->
    <line class="logo-stroke" x1="50" y1="32" x2="50" y2="85"/>

    <!-- Right chevron -->
    <polyline class="logo-stroke" points="85,32 92,50 85,68"/>
</svg>