<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210" width="260" height="210">
    <defs>
        <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <style>
            .mark {
                stroke: #5340E0;
                stroke-width: 22;
                stroke-linecap: round;
                stroke-linejoin: round;
                fill: none;
            }
        </style>
    </defs>

    <g filter="url(#logoGlow)">
        <!-- Top bar — exact same length as the T crossbar -->
        <line class="mark" x1="88" y1="37" x2="172" y2="37"/>

        <!-- Left chevron -->
        <polyline class="mark" points="54,64 17,110 54,160"/>

        <!-- T — horizontal bar -->
        <line class="mark" x1="88" y1="87" x2="172" y2="87"/>
        <!-- T — vertical stem -->
        <line class="mark" x1="130" y1="87" x2="130" y2="160"/>

        <!-- Right chevron -->
        <polyline class="mark" points="206,64 243,110 206,160"/>
    </g>
</svg>