<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
    <defs>
        <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <style>
            .mark {
                stroke: #5340E0;
                stroke-width: 22;
                stroke-linecap: round;
                stroke-linejoin: round;
                fill: none;
            }
        </style>
    </defs>

    <!-- Square dark badge background with rounded corners -->
    <rect x="0" y="0" width="260" height="260" rx="32" ry="32" fill="#08080F"/>

    <g filter="url(#iconGlow)">
        <!-- Top bar — exact same length as the T crossbar -->
        <line class="mark" x1="88" y1="69" x2="172" y2="69"/>

        <!-- Left chevron -->
        <polyline class="mark" points="54,96 17,142 54,192"/>

        <!-- T — horizontal bar -->
        <line class="mark" x1="88" y1="119" x2="172" y2="119"/>
        <!-- T — vertical stem -->
        <line class="mark" x1="130" y1="119" x2="130" y2="192"/>

        <!-- Right chevron -->
        <polyline class="mark" points="206,96 243,142 206,192"/>
    </g>
</svg>