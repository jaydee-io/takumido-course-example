<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
    <defs>
        <style>
            .takumido-stroke {
                stroke: #7C3AED;
                stroke-width: 3.5;
                stroke-linecap: round;
                stroke-linejoin: round;
                fill: none;
            }
        </style>
    </defs>

    <!-- Top horizontal bar -->
    <line class="takumido-stroke" x1="25" y1="30" x2="135" y2="30"/>

    <!-- Left chevron < -->
    <polyline class="takumido-stroke" points="40,50 22,80 40,110"/>

    <!-- T shape (centered) -->
    <!-- Horizontal bar of T -->
    <line class="takumido-stroke" x1="48" y1="50" x2="112" y2="50"/>
    <!-- Vertical stem of T -->
    <line class="takumido-stroke" x1="80" y1="50" x2="80" y2="115"/>

    <!-- Right chevron > -->
    <polyline class="takumido-stroke" points="120,50 138,80 120,110"/>
</svg>