<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <!-- Purple color #7C3AED -->
    <g stroke="#7C3AED" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Top bar (horizontal line above) -->
        <line x1="20" y1="20" x2="100" y2="20"/>

        <!-- Left chevron < -->
        <polyline points="35,35 25,60 35,85"/>

        <!-- T shape centered -->
        <g>
            <!-- Horizontal bar of T -->
            <line x1="40" y1="35" x2="80" y2="35"/>
            <!-- Vertical stem of T -->
            <line x1="60" y1="35" x2="60" y2="85"/>
        </g>

        <!-- Right chevron > -->
        <polyline points="85,35 95,60 85,85"/>
    </g>
</svg>