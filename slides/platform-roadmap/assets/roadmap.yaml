# Story 5.5: data-driven roadmap. Only i18n KEYS here (never literal text) — the labels
# resolve per render language from i18n/<lang>.yaml. Statuses are deliberately UNSORTED
# to prove the backend segments each branch into the honest order (shipped → soon →
# exploring); `version` only appears on shipped nodes.
schema_version: 1
title: roadmap.title
branches:
  - id: apprentice
    label: roadmap.apprentice.label
    nodes:
      - id: graph-edit
        label: roadmap.apprentice.graph_edit
        status: soon
        detail: roadmap.apprentice.graph_edit_detail
      - id: play-pause
        label: roadmap.apprentice.play_pause
        status: shipped
        detail: roadmap.apprentice.play_pause_detail
        version: "0.8.0"
      - id: gamification
        label: roadmap.apprentice.gamification
        status: exploring
      - id: chapter-menu
        label: roadmap.apprentice.chapter_menu
        status: shipped
  - id: trainer
    label: roadmap.trainer.label
    nodes:
      - id: analytics
        label: roadmap.trainer.analytics
        status: exploring
      - id: dashboard
        label: roadmap.trainer.dashboard
        status: shipped
        detail: roadmap.trainer.dashboard_detail
        version: "0.8.0"
      - id: notifications
        label: roadmap.trainer.notifications
        status: soon
