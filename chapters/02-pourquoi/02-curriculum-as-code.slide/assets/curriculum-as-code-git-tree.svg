<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <!-- S2 — Arbre git « curriculum-as-code » (Story 5.7). Conçue GÉNÉRIQUE pour être
       réemployée telle quelle au Ch.4 (Story 5.9) : aucun libellé propre au Ch.2, seule
       la notation semver (universelle) apparaît. Style sumi-e maison : fond transparent,
       trait fin, un seul accent-sceau. Palette = tokens 5.1 (encre #1C1A17, gris #6B6358,
       sceau #C8503C). -->
  <!-- Tronc : la ligne de commits -->
  <line x1="130" y1="60" x2="130" y2="250" stroke="#1C1A17" stroke-width="2" stroke-linecap="round"/>
  <!-- Branche : un écart puis un retour (curriculum qui évolue) -->
  <path d="M130 170 C185 165 220 150 230 120" fill="none" stroke="#6B6358" stroke-width="1.5"
        stroke-linecap="round" opacity="0.75"/>
  <path d="M230 120 C240 105 200 95 130 100" fill="none" stroke="#6B6358" stroke-width="1.5"
        stroke-linecap="round" opacity="0.75"/>
  <!-- Commits sur le tronc -->
  <circle cx="130" cy="250" r="8" fill="none" stroke="#1C1A17" stroke-width="2"/>
  <circle cx="130" cy="170" r="8" fill="none" stroke="#1C1A17" stroke-width="2"/>
  <circle cx="130" cy="100" r="8" fill="none" stroke="#1C1A17" stroke-width="2"/>
  <!-- Commit de branche -->
  <circle cx="230" cy="120" r="7" fill="none" stroke="#6B6358" stroke-width="1.5"/>
  <!-- Tag publié : l'unique accent-sceau + notation semver (langue-neutre) -->
  <circle cx="130" cy="60" r="11" fill="#C8503C"/>
  <line x1="141" y1="60" x2="176" y2="60" stroke="#1C1A17" stroke-width="1.5" stroke-linecap="round"/>
  <text x="182" y="64" font-family="monospace" font-size="15" fill="#1C1A17">v1.0.0</text>
</svg>
