# Custom layout example. Unlike the built-in `takumido-*` primitives (provided by
# the platform), custom layouts live in this repository under `layouts/` and are
# named `<id>.layout.yaml`. They use the exact same DSL as the primitives — slots
# + composition — and are exposed to the renderer through the course bundle.
#
# `spotlight` is a header band spanning the full width above a two-column body
# (main detail + a narrower aside) — an arrangement no single primitive provides.
schema_version: 1
id: spotlight
title: hidden
slots:
  headline:
    accepts: [text]
    min: 1
    max: 1
    required: true
  detail:
    accepts: [text, callout, list]
    min: 1
    required: true
  aside:
    accepts: [text, callout]
    min: 0
    max: 1
    required: false
composition:
  type: grid
  template:
    # Story 5.4: rebalanced 2fr/1fr → 3fr/2fr (~60/40) so `detail` clearly leads
    # without starving `aside`; gap lg → xl for more breathing room.
    columns: 3fr 2fr
    rows: auto 1fr
    areas:
      - headline headline
      - detail aside
  gap: xl
  # NO `align_items` here: the grid default (stretch) lets `detail` fill the 1fr row so
  # `pane-v-scrollable` actually binds long text to the frame (Story 5.3 lesson —
  # align_items: center|start collapses the region to its content and neutralises the
  # scroll). The aside's top alignment is a LOCAL concern → `pane-align-top` on the
  # region, never `align_items` on the container.
  regions:
    - slot: headline
      area: headline
      # Story 5.4: pane-centered → pane-title-band (start-aligned locked band).
      classes: [pane, pane-title-band]
    - slot: detail
      area: detail
      # Story 5.4: bounded vertical overflow for long text/code cases.
      classes: [pane, pane-text, pane-v-scrollable]
    - slot: aside
      area: aside
      # Story 5.4: set back (tokenised secondary card) + top-aligned locally.
      classes: [pane, pane-text, pane-bg-dim, pane-align-top]
