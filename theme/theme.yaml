schema_version: 1
chapterTitle:
  format: "%n — %t"
font:
  # Serif display (Story 5.1). Vendored via @nuxt/fonts in the platform; injected as
  # --font-display on this course's .slide-engine only (the C++ course keeps its default).
  heading: "Fraunces"
  body: "Inter"
  codeSlide: "Cascadia Code"
popoverButton:
  inlineTitleIcon:
    iconName: "lucide:info"
# Per-slide brand watermark (Story 5.2): a discreet decorative icon painted bottom-right
# on content slides (never on the intro/outro lockup, cover or pause layouts). Resolved to
# a served asset URL at build; the asset lives at the course-root assets/ (moved there in 5.1).
icon: "@assets/takumido-icon.svg"
# Washi ivory surface (Story 5.1). Also mirrored in palette.surface-base below so every
# surface consumer resolves to washi, not just the slide background layer.
background:
  color: "#F7F4EE"
# Brand semantic roles (Story 1.23/1.24, +accent-secondary in 5.1). Drive the brand
# block (logo lockup wordmark/tagline/accent) on the intro/outro slides.
brand:
  accent: "#7C3AED"            # violet — wordmark accent + blinking cursor
  accent-secondary: "#C8503C"  # seal red — title-band bar, secondary accents (5.2+)
  surface: "#F7F4EE"           # brand block background (blends into the washi slide)
  ink: "#1C1A17"               # wordmark — warm near-black (never #000)
  muted: "#6B6358"             # tagline
# Per-course palette (Story 5.1): overrides the design-system colour tokens, scoped to
# this course's slides only (the platform dark defaults — and the C++ course relying on
# them — are untouched). These are the epic's LOCKED washi values.
palette:
  surface-base: "#F7F4EE"       # washi ivory
  surface-secondary: "#ECE7DD"  # title band background
  surface-tertiary: "#E0D9CB"   # inline-code badge (5.2)
  text-primary: "#1C1A17"       # warm near-black (never #000) — ~15:1 on washi (AAA)
  text-secondary: "#3A352E"     # warm dark grey
  text-muted: "#6B6358"
  accent-primary: "#7C3AED"     # violet — ~5.0:1 on washi (AA normal text)
  accent-secondary: "#C8503C"   # seal red
  text-on-accent: "#F7F4EE"     # ivory ON accent-secondary — LARGE text only (~4.10:1)
